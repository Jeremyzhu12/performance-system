<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="#1890ff" stroke="#0050b3" stroke-width="4"/>
  
  <!-- 绩效图标 - 柱状图 -->
  <rect x="80" y="140" width="20" height="60" fill="white" rx="2"/>
  <rect x="110" y="120" width="20" height="80" fill="white" rx="2"/>
  <rect x="140" y="100" width="20" height="100" fill="white" rx="2"/>
  <rect x="170" y="110" width="20" height="90" fill="white" rx="2"/>
  
  <!-- 标题文字 -->
  <text x="128" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">绩效</text>
  <text x="128" y="240" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">系统</text>
  
  <!-- 装饰元素 -->
  <circle cx="200" cy="70" r="8" fill="white" opacity="0.8"/>
  <circle cx="60" cy="180" r="6" fill="white" opacity="0.6"/>
</svg>