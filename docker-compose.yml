version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - DATABASE_URL=mysql://root:123456@mysql:3306/performance_system
      - JWT_SECRET=performance-system-jwt-secret-2026
      - JWT_REFRESH_SECRET=performance-system-refresh-secret-2026
      - JWT_EXPIRES_IN=2h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=*
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=performance_system
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
